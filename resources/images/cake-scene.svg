<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!--
    The backdrop behind every cake picture (.cake-scene in resources/css/studio.css): a cream panelled wall on the left,
    ivory fluted columns on the right, window light from the upper right and a round white marble table in front.
    The empty spot for the cake is the middle of the table (about x 60-240, base near y 300), with a soft contact shadow.
    Portrait 3:4; used with background-size: cover, so any frame shows the middle of it.
  -->
  <defs>
    <!-- Walls: a little out of focus, so the table reads as in front -->
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="0.9"/></filter>
    <filter id="blur6" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur10" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="10"/></filter>

    <!-- Marble veins: thin creases of turbulence noise turned into grey lines -->
    <filter id="veins" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.007 0.03" numOctaves="4" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.725  0 0 0 0 0.722  0 0 0 0 0.71  -7 0 0 0 1.25"/>
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <filter id="fineVeins" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.06" numOctaves="3" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.725  0 0 0 0 0.722  0 0 0 0 0.71  -9 0 0 0 1.1"/>
    </filter>

    <linearGradient id="wallLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EAD8"/>
      <stop offset="1" stop-color="#E8DDC6"/>
    </linearGradient>
    <!-- One flute: light on its left edge, shadow on its right -->
    <linearGradient id="flute" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.25" stop-color="#FAF5EA"/>
      <stop offset="0.65" stop-color="#F6F0E2"/>
      <stop offset="0.9" stop-color="#E4DAC6"/>
      <stop offset="1" stop-color="#D9CDB6"/>
    </linearGradient>
    <pattern id="flutes" patternUnits="userSpaceOnUse" x="168" y="0" width="9.4" height="400">
      <rect width="9.4" height="400" fill="url(#flute)"/>
    </pattern>
    <!-- The rounded white moulding: highlight, body, shadow -->
    <linearGradient id="moulding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E1D0"/>
      <stop offset="0.18" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FBF8F2"/>
      <stop offset="0.8" stop-color="#E7DFCF"/>
      <stop offset="1" stop-color="#D3C8B3"/>
    </linearGradient>
    <linearGradient id="window" x1="1" y1="0" x2="0.2" y2="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#FFF8EA" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFF8EA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cornerShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A7458" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8A7458" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8A7458" stop-opacity="0"/>
    </linearGradient>
    <!-- The wall darkens a little just above the table -->
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E5A44" stop-opacity="0"/>
      <stop offset="1" stop-color="#6E5A44" stop-opacity="0.18"/>
    </linearGradient>

    <radialGradient id="marble" cx="0.42" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FAFAF8"/>
      <stop offset="0.6" stop-color="#F4F4F2"/>
      <stop offset="1" stop-color="#E6E5E1"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.55" stop-color="#3C2A1A" stop-opacity="0"/>
      <stop offset="1" stop-color="#3C2A1A" stop-opacity="0.28"/>
    </radialGradient>

    <clipPath id="table"><ellipse cx="150" cy="335" rx="225" ry="120"/></clipPath>
  </defs>

  <!-- Walls -->
  <g filter="url(#soft)">
    <rect width="300" height="400" fill="url(#wallLeft)"/>

    <!-- Raised panel: a 2px inner frame, lit on top/left, shaded on bottom/right -->
    <rect x="24" y="34" width="122" height="150" fill="#EDE3CE"/>
    <path d="M24 184V34h122" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M24 184h122V34" fill="none" stroke="#C9BA9C" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M31 177V41h108" fill="none" stroke="#CDBFA2" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M31 177h108V41" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>

    <!-- Moulding strip near the bottom of the wall -->
    <rect x="0" y="196" width="170" height="16" fill="url(#moulding)"/>
    <rect x="0" y="212" width="170" height="20" fill="#EDE4D0"/>

    <!-- Fluted columns, about 14 ridges -->
    <rect x="168" y="0" width="132" height="400" fill="url(#flutes)"/>
    <rect x="160" y="0" width="18" height="400" fill="url(#cornerShade)"/>

    <!-- Window light from the upper right -->
    <polygon points="300,0 175,0 40,260 300,260" fill="url(#window)"/>
    <rect x="0" y="180" width="300" height="50" fill="url(#horizon)"/>
  </g>

  <!-- The marble table -->
  <ellipse cx="150" cy="340" rx="228" ry="122" fill="#5E4C3A" opacity="0.18" filter="url(#blur6)"/>
  <ellipse cx="150" cy="335" rx="225" ry="120" fill="url(#marble)"/>
  <g clip-path="url(#table)">
    <g transform="rotate(-18 150 330)">
      <rect x="-120" y="170" width="540" height="360" filter="url(#veins)" opacity="0.6"/>
      <rect x="-120" y="170" width="540" height="360" filter="url(#fineVeins)" opacity="0.3"/>
    </g>
    <!-- A few warm beige patches -->
    <ellipse cx="60" cy="270" rx="40" ry="10" fill="#E3D3B8" opacity="0.35" filter="url(#blur6)"/>
    <ellipse cx="245" cy="300" rx="34" ry="9" fill="#E6D7BD" opacity="0.3" filter="url(#blur6)"/>
    <ellipse cx="120" cy="365" rx="50" ry="12" fill="#E3D3B8" opacity="0.25" filter="url(#blur6)"/>
    <!-- Gentle sheen -->
    <rect x="0" y="215" width="300" height="185" fill="url(#sheen)" opacity="0.8"/>
  </g>
  <ellipse cx="150" cy="335" rx="225" ry="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.2"/>

  <!-- Contact shadow under the cake, offset down-right -->
  <ellipse cx="157" cy="303" rx="82" ry="13" fill="#2A1E14" opacity="0.35" filter="url(#blur10)"/>

  <!-- Vignette -->
  <rect width="300" height="400" fill="url(#vignette)"/>
</svg>
